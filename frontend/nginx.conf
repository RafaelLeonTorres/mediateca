# Sirve el build de Angular y manda /api al contenedor de la API. Así el navegador ve un solo
# origen y la cookie de sesión funciona igual que con `npm start` y su proxy.conf.json.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/vtt;

    # DNS interno de Docker. Con la variable, nginx vuelve a resolver "api" cada 10 s y sigue
    # funcionando cuando el contenedor de la API se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location ^~ /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Audio y video: sin búfer, para que las respuestas parciales (206) lleguen directo al navegador.
        proxy_buffering off;
        proxy_read_timeout 1h;

        # Subtítulos subidos desde el reproductor: hasta 8 MB (la API revisa el límite exacto). Sin esto nginx
        # corta en 1 MB, y un .ass con fuentes incrustadas pasa de eso.
        client_max_body_size 9m;
    }

    # Archivos con hash en el nombre (main-XXXXXXXX.js): nunca cambian, así que se guardan un año.
    location ~* "-[a-z0-9]{8,}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rutas de Angular: lo que no es un archivo devuelve index.html, que no se guarda en caché.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
