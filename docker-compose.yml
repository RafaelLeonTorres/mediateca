# Mediateca en cuatro contenedores. El navegador solo habla con "web", así que la app y la API
# comparten origen (la cookie de sesión y el streaming funcionan sin CORS ni tokens en las URL).
#   web     nginx con el build de Angular; manda /api al contenedor "api".
#   api     ASP.NET Core 11; crea o actualiza la base de datos al iniciar. Pone los escaneos en la cola.
#   worker  corre los escaneos de la cola y el escaneo automático (Quartz). Arranca cuando la API está sana.
#   db      PostgreSQL 18.
# Primera vez: setup.ps1 en Windows, o en macOS y Linux los pasos del README.
# La configuración (contraseña y puertos) sale de .env; ver .env.example.
# Tus discos no se configuran aquí: setup.ps1 los monta de solo lectura en /discos/<letra> (api y worker)
# con un docker-compose.override.yml propio, que Compose une con este archivo. En Linux y macOS ese
# archivo se escribe a mano; ver el README.
name: mediateca

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediateca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (ejecuta setup.ps1 o copia .env.example)}
      POSTGRES_DB: postgres
    ports:
      # Solo desde este equipo: para herramientas de base de datos y para correr la API fuera de Docker.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      # Desde PostgreSQL 18, la imagen guarda los datos en un subdirectorio por versión de /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediateca -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      target: api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT:-Production}
      # Zona horaria de los horarios del escaneo automático (la API calcula las próximas ejecuciones).
      TZ: ${TZ:-America/Mexico_City}
      # La API está detrás de nginx: toma la IP y el esquema reales de X-Forwarded-For y X-Forwarded-Proto.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=mediateca;Username=mediateca;Password=${POSTGRES_PASSWORD}"
      Metadata__Omdb__ApiKey: ${OMDB_API_KEY:-}
      # Horario inicial del escaneo automático; después se cambia desde la administración.
      Scanning__DefaultCron: "${SCAN_CRON:-0 0 3 * * ?}"
    ports:
      # Solo desde este equipo: para `npm start` (proxy.conf.json) y para probar la API directamente.
      - "127.0.0.1:${API_PORT:-5080}:8080"
    volumes:
      - appdata:/data
      # Carpeta de medios opcional (MEDIA_PATH), de solo lectura, por ejemplo un NAS. Si no existe, Docker crea
      # ./media. Los discos del equipo van en /discos (ver docker-compose.override.yml).
      - ${MEDIA_PATH:-./media}:/media:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    develop:
      # `docker compose watch` recompila la imagen cuando cambia el código.
      watch:
        - action: rebuild
          path: ./backend/src
          ignore:
            - "**/bin"
            - "**/obj"

  worker:
    build:
      context: ./backend
      target: worker
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${API_ENVIRONMENT:-Production}
      TZ: ${TZ:-America/Mexico_City}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=mediateca;Username=mediateca;Password=${POSTGRES_PASSWORD}"
      Scanning__DefaultCron: "${SCAN_CRON:-0 0 3 * * ?}"
      # El worker es quien busca los metadatos de la cola, así que también necesita la clave.
      Metadata__Omdb__ApiKey: ${OMDB_API_KEY:-}
    volumes:
      - appdata:/data
      # La misma carpeta de medios (y, por el override, los mismos discos) que ve la API, de solo lectura.
      - ${MEDIA_PATH:-./media}:/media:ro
    depends_on:
      # El worker no aplica migraciones: espera a que la API haya preparado la base de datos.
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      # El worker escribe /tmp/mediateca-worker.alive cada 30 segundos.
      test: ["CMD-SHELL", "find /tmp/mediateca-worker.alive -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      # Mientras arranca revisa cada 5 s, así `docker compose up --wait` no espera 30 s de más.
      start_interval: 5s
    develop:
      watch:
        - action: rebuild
          path: ./backend/src
          ignore:
            - "**/bin"
            - "**/obj"

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    develop:
      watch:
        - action: rebuild
          path: ./frontend/src
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/nginx.conf

volumes:
  pgdata:
  appdata:
